# Weekly: test the newest stable Python and uv together before proposing new pins.
name: Python and uv upgrades

on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: python-upgrade-toolchain

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  npm_config_update_notifier: "false"
  JJ_USER: CI
  JJ_EMAIL: ci@example.invalid
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify uv and select the newest stable CPython
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=uv-x86_64-unknown-linux-gnu
          release=$(gh api repos/astral-sh/uv/releases/latest --jq \
            '.tag_name as $tag | .assets[] | select(.name == "uv-x86_64-unknown-linux-gnu.tar.gz") | [$tag, .digest] | @tsv')
          read -r uv_version published_digest <<< "$release"
          if [[ ! "$uv_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$published_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The latest uv release is missing a stable tag or the published SHA-256 for $archive.tar.gz." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          digest=${published_digest#sha256:}
          pins=$(python3 scripts/python_upgrade.py pins)
          read -r pinned_uv pinned_digest pinned_python <<< "$pins"
          # Keep the checked-in uv if GitHub's latest release is behind it.
          if [[ "$(printf '%s\n' "$uv_version" "$pinned_uv" | sort -V | tail -1)" != "$uv_version" ]]; then
            uv_version=$pinned_uv
            digest=$pinned_digest
          fi
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/astral-sh/uv/releases/download/$uv_version/$archive.tar.gz"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          uv_bin="$RUNNER_TEMP/$archive"
          "$uv_bin/uv" --version
          newest_python=$("$uv_bin/uv" python list --only-downloads --all-versions --offline --output-format json \
            | python3 scripts/python_upgrade.py latest-python)
          python=$(printf '%s\n' "$newest_python" "$pinned_python" | sort -V | tail -1)
          printf 'Current pins are uv %s and CPython %s. Checking uv %s and CPython %s.\n' \
            "$pinned_uv" "$pinned_python" "$uv_version" "$python" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$uv_version" == "$pinned_uv" && "$python" == "$pinned_python" ]]; then
            echo "The pins are current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/python_upgrade.py write-pins "$uv_version" "$digest" "$python"
          echo "$uv_bin" >> "$GITHUB_PATH"
          echo "PYTHON_VERSION=$python" >> "$GITHUB_ENV"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Check the lock and build or install each dependency
        if: steps.candidate.outputs.changed == 'true'
        run: |
          server=review-dashboard/server
          before="$RUNNER_TEMP/uv-before.lock"
          log="$RUNNER_TEMP/uv-sync.log"
          cp "$server/uv.lock" "$before"
          show_failure() {
            printf '\n%s\n\n```text\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            tail -40 "$log" >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          }
          echo "### Install CPython $PYTHON_VERSION" >> "$GITHUB_STEP_SUMMARY"
          if ! uv python install "$PYTHON_VERSION"; then
            echo "CPython $PYTHON_VERSION installation failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! uv lock --check --directory "$server" --python "$PYTHON_VERSION"; then
            if ! uv lock --directory "$server" --python "$PYTHON_VERSION" --color never 2>&1 | tee "$log"; then
              show_failure "uv lock failed."
              exit 1
            fi
          fi
          echo "### Locked package versions" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/python_upgrade.py lock-changes "$before" "$server/uv.lock" >> "$GITHUB_STEP_SUMMARY"
          status=0
          # An empty sync cache makes every wheel built from source visible in uv's output.
          uv sync --locked --directory "$server" --python "$PYTHON_VERSION" \
            --cache-dir "$RUNNER_TEMP/uv-sync-cache" --color never --no-progress 2>&1 | tee "$log" || status=$?
          echo "### Packages that required a source build" >> "$GITHUB_STEP_SUMMARY"
          builds=$(sed -nE 's/^[[:space:]]*(Building|Built)[[:space:]]+//p' "$log" | sort -u)
          if [[ -n "$builds" ]]; then
            printf '%s\n' "$builds" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "None reported." >> "$GITHUB_STEP_SUMMARY"
          fi
          if (( status != 0 )); then
            show_failure "uv sync --locked failed."
            exit "$status"
          fi
      - name: Install the remaining test tools and dependencies
        if: steps.candidate.outputs.changed == 'true'
        uses: ./.github/actions/setup
        with:
          install-python: "false"
      - name: Run the offline suites
        if: steps.candidate.outputs.changed == 'true'
        env:
          UV_OFFLINE: "1"
          npm_config_offline: "true"
        run: |
          printf '\n### Offline suites\n' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          check() {
            local log="$RUNNER_TEMP/offline-test.log"
            if "$@" 2>&1 | tee "$log"; then
              printf -- '- `%s` passed.\n' "$*" >> "$GITHUB_STEP_SUMMARY"
            else
              printf -- '- `%s` failed.\n' "$*" >> "$GITHUB_STEP_SUMMARY"
              sed -nE 's/^(FAIL|ERROR): /  - /p' "$log" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          }
          check make check-version
          for ledger in fixtures/ledgers/*; do
            server_tests=persona
            if [[ "$ledger" == fixtures/ledgers/asha ]]; then
              server_tests=all
            fi
            check make test-ledger "LEDGER_DIR=$ledger"
            check make test-migrations "LEDGER_DIR=$ledger"
            check make test-server "LEDGER_DIR=$ledger" "SERVER_TESTS=$server_tests"
          done
          exit "$failed"
      - name: Open a pull request with the checked pins
        if: steps.candidate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: python-upgrade/toolchain
          delete-branch: true
          add-paths: |
            .github/actions/setup/action.yml
            review-dashboard/server/.python-version
            review-dashboard/server/pyproject.toml
            review-dashboard/server/uv.lock
            tools/browser-box/browser_box.py
          commit-message: Upgrade the Python and uv toolchain pins
          title: Upgrade the Python and uv toolchain pins
          body: |
            The scheduled check verified the published uv archive digest, selected the
            newest stable CPython available from uv, and synced the locked server
            environment. The job summary lists packages built from source and changes
            to locked package versions.

            `make check-version`, the ledger and migration suites for every fixture,
            and the offline server suite (including persona-sensitive coverage) passed.
            The server tests use fake agents.

            Merge for a minor release with numbered Upgrade notes to run
            `make install`, then `make doctor`. If the installed uv cannot download
            the new Python, update uv before running `make install`.
