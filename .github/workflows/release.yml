# On a version tag: check that VERSION and the changelog match it, then publish a GitHub release
# whose notes are that version's changelog section. See docs/RELEASING.md.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: VERSION matches the tag
        run: |
          version="$(cat VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "VERSION is $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION_NUMBER=$version" >> "$GITHUB_ENV"
      - name: Version files agree
        run: make check-version
      - name: The changelog dates this release
        run: |
          if ! grep -Eq "^## \[${VERSION_NUMBER//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md; then
            echo "CHANGELOG.md needs a dated '## [$VERSION_NUMBER] - YYYY-MM-DD' section" >&2
            exit 1
          fi
      - name: Release notes from the changelog
        run: python3 scripts/releases.py notes "$VERSION_NUMBER" > "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$VERSION_NUMBER" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "AgentExpense $VERSION_NUMBER" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
