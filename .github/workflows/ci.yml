# On every push and pull request: the personal-data and secret scans, and the offline
# suites for each fictional persona. The headless browsers and the update test run in
# browsers.yml (version tags, by hand and weekly). Nothing here reads a private list,
# signs in to an agent or runs a model.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  npm_config_update_notifier: "false"
  GITLEAKS_VERSION: "8.18.4"
  JJ_USER: CI
  JJ_EMAIL: ci@example.invalid
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@example.invalid

jobs:
  privacy:
    name: Personal-data and secret scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Personal-data scan with an empty list
        # The real list is private and never leaves the owner's machine.
        run: |
          list="$RUNNER_TEMP/private-list.tsv"
          : > "$list"
          python3 scripts/check_private.py --list "$list"
      - name: Personal-data scanner tests
        run: python3 -m unittest discover -s scripts/tests -p test_check_private.py -v
      - name: Secret scan (gitleaks, pinned)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          mkdir gitleaks
          tar -xzf "$archive" -C gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --redact --no-banner --exit-code 1

  offline:
    name: Offline suites and build (${{ matrix.persona }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        persona: [asha, empty, jordan, sam]
    env:
      LEDGER_DIR: ${{ github.workspace }}/fixtures/ledgers/${{ matrix.persona }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: make doctor
      - name: Verify, test migrations and build
        run: make dashboard
      - name: Server tests
        # The full suite once; other personas run the persona-sensitive tests.
        run: make test-server SERVER_TESTS=${{ matrix.persona == 'asha' && 'all' || 'persona' }}
      - name: Dashboard tests
        run: npm --prefix review-dashboard test
      - name: Scanner, doctor and tooling tests
        run: make test-scanner
      - name: Workflow structure check
        if: matrix.persona == 'asha'
        run: make check-workflows
