[project]
name = "expense-dashboard-server"
version = "0.1.0"
description = "Live server for the expense dashboard: serves the built dashboard and adds expenses through drafts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jsonschema>=4.22",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "pyoxipng>=9.0",
    "pypdf[crypto]>=6.1",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[tool.uv]
package = false
