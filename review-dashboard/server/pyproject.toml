[project]
name = "expense-dashboard-server"
version = "0.1.0"
description = "Live server for the expense dashboard: serves the built dashboard and adds expenses through drafts"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jsonschema>=4.22",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "pyoxipng>=9.0",
    "pypdf[crypto]>=6.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "xlwt==1.3.0",
]

[tool.uv]
package = false
